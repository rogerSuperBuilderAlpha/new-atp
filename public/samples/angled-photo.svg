<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1200" viewBox="0 0 1000 1200">
  <defs>
    <linearGradient id="glare" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="1200" fill="#172554"/>
  <g transform="translate(500 590) rotate(-9) translate(-430 -560)">
    <rect x="80" y="70" width="700" height="1010" rx="28" fill="#f8fafc" stroke="#d4af37" stroke-width="9"/>
    <text x="430" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="54" font-weight="700" fill="#172554">HARBOR LIGHT</text>
    <text x="430" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" fill="#172554">Imported Lager Beer</text>
    <text x="430" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#172554">5.2% Alc./Vol.</text>
    <text x="430" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#172554">12 FL OZ</text>
    <text x="430" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#172554">Imported by Harbor Light Imports, Seattle, WA</text>
    <text x="430" y="670" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#172554">Country of Origin: Germany</text>
    <text x="110" y="840" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172554">GOVERNMENT WARNING:</text>
    <text x="110" y="870" font-family="Arial, sans-serif" font-size="19" fill="#172554">(1) According to the Surgeon General, women should not drink alcoholic</text>
    <text x="110" y="898" font-family="Arial, sans-serif" font-size="19" fill="#172554">beverages during pregnancy because of the risk of birth defects.</text>
    <text x="110" y="926" font-family="Arial, sans-serif" font-size="19" fill="#172554">(2) Consumption of alcoholic beverages impairs your ability to drive a</text>
    <text x="110" y="954" font-family="Arial, sans-serif" font-size="19" fill="#172554">car or operate machinery, and may cause health problems.</text>
    <rect x="170" y="80" width="220" height="980" fill="url(#glare)" opacity="0.55"/>
  </g>
</svg>
